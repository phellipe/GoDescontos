# =============================================================================
# DEVELOPMENT INFRASTRUCTURE ONLY
# Use this when you want to run backend, worker, and web locally (outside Docker)
# but need PostgreSQL and Redis running in containers
# =============================================================================
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: godescontos-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: godescontos
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d godescontos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - godescontos-dev-network

  # Redis for caching and BullMQ queues
  redis:
    image: redis:7-alpine
    container_name: godescontos-redis-dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - godescontos-dev-network

  # Adminer - Lightweight database management tool (alternative to pgAdmin)
  adminer:
    image: adminer:latest
    container_name: godescontos-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula  # Optional: change theme
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - godescontos-dev-network

  # RedisInsight - Redis GUI for monitoring queues and cache
  # Access at http://localhost:8001
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: godescontos-redis-insight
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - godescontos-dev-network
    profiles:
      - tools  # Optional, enable with: docker-compose --profile tools up

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  redis_insight_data:
    driver: local

networks:
  godescontos-dev-network:
    driver: bridge
    name: godescontos-dev-network
