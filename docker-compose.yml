version: '3.8'

# =============================================================================
# GODESCONTOS - COMPLETE DEVELOPMENT STACK
# =============================================================================
# Services: PostgreSQL, Redis, Backend API, Worker (BullMQ), Web Frontend
# Network: All services communicate via godescontos-network bridge
# Volumes: Named volumes for data persistence and node_modules performance
# =============================================================================

services:
  # ===========================================================================
  # DATABASE - PostgreSQL 16
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: godescontos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: godescontos
      # Performance tuning for development
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      # Increase max connections for development
      POSTGRES_MAX_CONNECTIONS: 100
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d godescontos']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - godescontos-network
    # Resource limits (prevent database from consuming too much memory)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # CACHE & QUEUES - Redis 7
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: godescontos-redis
    restart: unless-stopped
    # Redis configuration for development
    # appendonly: Persistence enabled
    # maxmemory: Limit memory usage to 256MB
    # maxmemory-policy: LRU eviction when limit reached
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - godescontos-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================================================
  # DATABASE MANAGEMENT - pgAdmin (optional)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: godescontos-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@godescontos.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - godescontos-network
    profiles:
      - tools  # Enable with: docker-compose --profile tools up
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ===========================================================================
  # BACKEND API - Node.js + Express + Prisma
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development  # Use development stage for hot-reload
      cache_from:
        - godescontos-backend:latest
      # Build-time arguments (if needed)
      args:
        NODE_ENV: development
    image: godescontos-backend:dev
    container_name: godescontos-backend
    restart: unless-stopped
    environment:
      # Runtime environment
      NODE_ENV: development
      PORT: 3000

      # Database connection (uses service name as hostname)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/godescontos?schema=public&connection_limit=10&pool_timeout=20

      # Redis connection
      REDIS_URL: redis://redis:6379

      # JWT configuration (CHANGE IN PRODUCTION!)
      JWT_SECRET: dev-jwt-secret-change-in-production-32chars-min
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production-32chars-min
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # Security
      BCRYPT_ROUNDS: 10
      CORS_ORIGIN: http://localhost:5173,http://localhost:19006

      # Stripe payments
      STRIPE_SECRET_KEY: sk_test_your_key_here
      STRIPE_WEBHOOK_SECRET: whsec_your_secret_here
      STRIPE_SUCCESS_URL: http://localhost:5173/payment/success
      STRIPE_CANCEL_URL: http://localhost:5173/payment/cancel

      # Email (development mode)
      EMAIL_FROM: noreply@godescontos.com
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: 587
      EMAIL_USER: user
      EMAIL_PASSWORD: password

      # Admin user
      ADMIN_EMAIL: admin@godescontos.com
      ADMIN_PASSWORD: Admin123!@#

      # Application URLs
      WEB_URL: http://localhost:5173
      MOBILE_URL: exp://localhost:19000

      # Logging level
      LOG_LEVEL: debug
    ports:
      - '3000:3000'
    volumes:
      # Source code hot-reload (cached for better performance on macOS/Windows)
      - ./backend/src:/app/src:cached
      - ./backend/prisma:/app/prisma:cached

      # Uploads persistence
      - ./backend/uploads:/app/uploads

      # Named volume for node_modules (better performance on Windows/macOS)
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s  # Increased start period for migrations
    networks:
      - godescontos-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Separate init script for migrations (runs once on startup)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== GoDescontos Backend Starting ==="
        echo "Waiting for database to be ready..."

        # Run migrations (idempotent - safe to run multiple times)
        echo "Running database migrations..."
        npx prisma migrate deploy

        # Seed database (only if empty - implement check in seed script)
        echo "Seeding database (if needed)..."
        npm run seed || echo "Seed skipped or failed (this is OK if DB already seeded)"

        # Start development server with hot-reload
        echo "Starting backend server..."
        exec npm run dev

  # ===========================================================================
  # BACKGROUND WORKER - BullMQ Job Processor
  # ===========================================================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      target: development
      cache_from:
        - godescontos-worker:latest
      args:
        NODE_ENV: development
    image: godescontos-worker:dev
    container_name: godescontos-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development

      # Redis connection (for BullMQ queues)
      REDIS_URL: redis://redis:6379

      # Database connection (worker needs Prisma for data operations)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/godescontos?schema=public&connection_limit=5&pool_timeout=20

      # Logging
      LOG_LEVEL: debug

      # Email configuration (worker sends emails)
      EMAIL_FROM: noreply@godescontos.com
      EMAIL_HOST: smtp.example.com
      EMAIL_PORT: 587
      EMAIL_USER: user
      EMAIL_PASSWORD: password

      # Push notifications
      EXPO_ACCESS_TOKEN: your_expo_token_here
      VAPID_PUBLIC_KEY: your_vapid_public_key
      VAPID_PRIVATE_KEY: your_vapid_private_key
      VAPID_SUBJECT: mailto:contato@godescontos.com
    volumes:
      # Source code hot-reload
      - ./worker/src:/app/src:cached

      # IMPORTANT: Mount Prisma schema from backend (shared schema)
      - ./backend/prisma:/app/prisma:cached

      # Named volume for node_modules
      - worker_node_modules:/app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Worker doesn't need backend to be healthy, just needs DB and Redis
    networks:
      - godescontos-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    # Ensure Prisma client is generated before starting
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== GoDescontos Worker Starting ==="

        # Generate Prisma client from mounted schema
        echo "Generating Prisma client..."
        npx prisma generate

        # Start worker
        echo "Starting worker..."
        exec npm run dev

  # ===========================================================================
  # WEB FRONTEND - React + Vite
  # ===========================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: development
      cache_from:
        - godescontos-web:latest
      args:
        NODE_ENV: development
    image: godescontos-web:dev
    container_name: godescontos-web
    restart: unless-stopped
    environment:
      # Vite environment variables (must start with VITE_)
      VITE_API_URL: http://localhost:3000/api
      NODE_ENV: development
    ports:
      - '5173:5173'
    volumes:
      # Source code hot-reload (Vite HMR)
      - ./web/src:/app/src:cached
      - ./web/public:/app/public:cached
      - ./web/index.html:/app/index.html:cached
      - ./web/vite.config.ts:/app/vite.config.ts:cached

      # Named volume for node_modules
      - web_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - godescontos-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Start Vite dev server with host binding for Docker
    command: npm run dev -- --host 0.0.0.0

# =============================================================================
# VOLUMES - Data Persistence
# =============================================================================
volumes:
  # Database data (persists across container restarts)
  postgres_data:
    driver: local
    name: godescontos_postgres_data

  # Redis data (persists queue jobs and cache)
  redis_data:
    driver: local
    name: godescontos_redis_data

  # pgAdmin configuration
  pgadmin_data:
    driver: local
    name: godescontos_pgadmin_data

  # Named volumes for node_modules (CRITICAL for Windows/macOS performance)
  # Prevents syncing node_modules which contains thousands of small files
  backend_node_modules:
    driver: local
    name: godescontos_backend_node_modules

  worker_node_modules:
    driver: local
    name: godescontos_worker_node_modules

  web_node_modules:
    driver: local
    name: godescontos_web_node_modules

# =============================================================================
# NETWORKS - Service Communication
# =============================================================================
networks:
  godescontos-network:
    driver: bridge
    name: godescontos-network
    # Enable IPv6 (optional)
    # enable_ipv6: true
